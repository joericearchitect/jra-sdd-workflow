name: OpenSpec Linkage

on:
  pull_request:

permissions:
  contents: read

jobs:
  linkage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: pr
        with:
          script: |
            const fs = require("fs");
            fs.writeFileSync("pr-body.md", context.payload.pull_request.body || "");
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validation/validate-openspec-linkage.mjs --body-file pr-body.md
